org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# NeoGradle's NeoForm pipeline does not restore its generated patch directory correctly after clean
# when the Gradle configuration cache is reused.
org.gradle.configuration-cache=false

# Platform dependencies
minecraft_version=26.1.1
minecraft_version_range=[26.1.1,26.2)
# This release line relies on the recipe JSON reload hook introduced in 26.1.1.
# The mod metadata accepts 26.1.1 and 26.1.2, through (but excluding) 26.2.
neo_version=26.1.1.15-beta
neo_version_range=[26.1.1.0-beta,26.2)
jei_version=29.4.0.23

mod_id=acidglows_ingame_recipe_editor
mod_name=Acidglow's Ingame Recipe Editor
mod_license=MIT
mod_version=1.0.0+mc26.1
mod_group_id=acidglow.ingamerecipeeditor
